# Pre-commit hooks to prevent secrets and sensitive data from being committed
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Detect secrets in code
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # General secret detection
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # GitLeaks - comprehensive secret scanner
  - repo: https://github.com/gitleaks/gitleaks-action
    rev: v2.3.2
    hooks:
      - id: gitleaks

  # Check for environment files
  - repo: local
    hooks:
      - id: no-commit-secrets
        name: Prevent secrets in commits
        entry: bash -c 'if grep -r "DASH_PASS\|DB_PASSWORD\|API_KEY\|SECRET_KEY\|TOKEN" --include="*.py" --include="*.js" --include="*.ts" --include="*.env" . 2>/dev/null | grep -v ".example" | grep -v ".pre-commit"; then echo "❌ Found potential secrets!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

      - id: no-env-files
        name: Prevent .env files from being committed
        entry: bash -c 'if git ls-files --cached | grep -E "\.env($|\.)" | grep -v "\.example"; then echo "❌ .env file detected in staging!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
